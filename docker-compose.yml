services:
  postgres:
    image: postgres:17-alpine
    container_name: community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-community}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-community}
      POSTGRES_DB: ${POSTGRES_DB:-community}
    ports:
      - '5433:5432'
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U community -d community']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - community_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  community_pgdata:
  community_redisdata: